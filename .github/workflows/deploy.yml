name: Deploy Automático HostGator

on:
    push:
        branches:
            - main

jobs:
    web-deploy:
        name: Deploy do Site
        runs-on: ubuntu-latest
        steps:
            - name: Pegar os arquivos mais recentes
              uses: actions/checkout@v4

            - name: Enviar para a HostGator via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  # A conta de FTP dedicada já entra dentro de public_html,
                  # então o destino é a própria raiz da sessão.
                  server-dir: ./
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/.github/**
                      **/README.md
                      **/node_modules/**
                      _arquivo/**
                      _projeto-speedtest/**
                      build/**
                      reports/**
                      **/*.report.html
                      **/*.report.json
