<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Página de erro: não deve aparecer nos resultados de busca. -->
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#181d2f" />

        <title>Página não encontrada | Wellington Barboza</title>

        <!-- Caminhos absolutos: esta página é servida em qualquer URL que
             não exista, inclusive em subpastas. -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link
            rel="preload"
            href="/assets/fonts/jetbrains-mono-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="/css/style.css?v=20261027" />
    </head>

    <body>
        <main class="hero">
            <p class="hero-intro">Erro 404</p>

            <h1 class="hero-name">Página não encontrada</h1>

            <p class="hero-tagline">
                O endereço que você tentou abrir não existe ou mudou de
                lugar.
            </p>

            <a href="/" class="btn-primary">Voltar para o início</a>
        </main>
    </body>
</html>
